<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1326"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="wingMain" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="45%" stop-color="#0ea5e9"/>
      <stop offset="85%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="wingCrease" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="wingShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="docBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.6)"/>
      <stop offset="100%" stop-color="rgba(45, 212, 191, 0.2)"/>
    </linearGradient>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#docBorder)" stroke-width="2"/>

  <!-- Folded Document Silhouette Behind -->
  <path d="M14 46V18C14 15.8 15.8 14 18 14H34L46 26V46C46 48.2 44.2 50 42 50H18C15.8 50 14 48.2 14 46Z" fill="#0e223d" fill-opacity="0.85"/>
  <path d="M34 14V24C34 25.1 34.9 26 36 26H46" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Aerodynamic Paper Plane Wing Ascent (The "Fly" Vector) -->
  <!-- Underwing Shadow -->
  <path d="M23 44L52 16L37 43L27 38Z" fill="url(#wingShadow)"/>

  <!-- Main Lifting Wing -->
  <path d="M13 32L52 16L30 46L23 44Z" fill="url(#wingMain)"/>

  <!-- Fold / Dorsal Ridge specular highlight -->
  <path d="M30 46L52 16L40 40L30 46Z" fill="url(#wingCrease)"/>

  <!-- Thruster speed dot -->
  <circle cx="16" cy="46" r="3" fill="#38bdf8"/>
  <circle cx="16" cy="46" r="1.5" fill="#ffffff"/>
</svg>