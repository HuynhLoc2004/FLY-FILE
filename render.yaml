services:
  - type: web
    name: fly-file-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODELS
        value: gemini-2.0-flash
      - key: GEMINI_TRANSLATION_WORKERS
        value: "1"
      - key: GEMINI_MIN_REQUEST_INTERVAL_SECONDS
        value: "2.5"
      - key: TRANSLATION_PAGE_BATCH_SIZE
        value: "8"
      - key: CORS_ORIGINS
        value: "*"

